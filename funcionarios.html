<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funcionarios · Colegio Marina de Chile</title>
  <link rel="icon" href="insignia.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0a1f52">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261102c">
</head>
<body>
  <div class="tv">
    <div id="hdr"></div>

    <main class="split">
      <!-- Mitad izquierda: televisión -->
      <section class="tv-side">
        <div class="player" id="player"></div>
        <div class="channels">
          <div class="card-title"><span class="dot"></span>Canales
            <span class="hint" style="margin-left:auto">
              <kbd>◀ ▶ ▲ ▼</kbd> elegir · <kbd>OK</kbd> cambiar · <kbd>CH+/CH−</kbd> · números
            </span>
          </div>
          <div class="channel-list" id="channels"></div>
        </div>
      </section>

      <!-- Mitad derecha: información del colegio -->
      <section class="card info2 info3">
        <!-- fotos y videos (actividades del colegio y educación) -->
        <div class="gallery" id="gal"></div>
        <div class="agenda-box">
          <div class="card-title"><span class="dot"></span>📅 Actividades de la semana · funcionarios</div>
          <div class="scroller" id="agenda"></div>
        </div>
      </section>
    </main>

    <footer class="ticker" id="ticker"></footer>
  </div>

  <script src="config.js?v=20261102c"></script>
  <script src="api.js?v=20261102c"></script>
  <script src="common.js?v=20261102c"></script>
  <script src="funcionarios.js?v=20261102c"></script>
</body>
</html>
