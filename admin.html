<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrador · Colegio Marina de Chile</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="insignia.png">
  <link rel="manifest" href="admin.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0a1f52">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261108a">
  <style>
    body { overflow: auto; font-size: 15px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    .top { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .top img { height: 64px; }
    .top h1 { font-size: 22px; color: #fff; }
    .top p { color: var(--gold); font-size: 13px; letter-spacing: .25em; text-transform: uppercase; }
    .top .right { margin-left: auto; display: flex; gap: 8px; }
    .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    .login { max-width: 380px; margin: 12vh auto; text-align: center; }
    .login img { height: 120px; margin: 0 auto 12px; }
    .nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .nav button { background: var(--glass); border: 1px solid var(--line); border-radius: 99px; padding: 9px 16px; cursor: pointer; font-weight: 700; }
    .nav button.on { background: var(--gold); color: var(--navy-900); border-color: var(--gold); }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .top .right { display: none; } }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; display: flex; flex-direction: column; gap: 5px; }
    input, textarea, select {
      font: inherit; color: #fff; background: rgba(6,21,58,.6); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; text-transform: none; letter-spacing: 0; font-weight: 500;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); }
    textarea { min-height: 90px; resize: vertical; }
    .btn { background: var(--gold); color: var(--navy-900); border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 800; cursor: pointer; }
    .btn.ghost { background: var(--glass-strong); color: #fff; }
    .btn:disabled { opacity: .5; cursor: wait; }
    h2 { font-size: 17px; color: #fff; margin-bottom: 14px; }
    .items { display: flex; flex-direction: column; gap: 8px; }
    .item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(6,21,58,.5); }
    .item img { width: 96px; height: 54px; object-fit: cover; border-radius: 8px; }
    .item .t { flex: 1; min-width: 0; }
    .item .t b { color: #fff; display: block; }
    .item .t small { color: var(--muted); }
    .item { flex-wrap: wrap; }
    /* fila de sonido de cada video publicado (editable) */
    .sonido-fila {
      flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-top: 4px; padding: 8px 10px; border-radius: 10px;
      background: rgba(246,201,14,.08); border: 1px dashed rgba(246,201,14,.45);
    }
    .cat-fila { flex-basis: 100%; display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .item .cat-sel { font-size: 13px; padding: 6px 8px; border-radius: 8px; }
    .sf-tit { font-weight: 800; color: var(--gold); font-size: 13px; }
    .sf-veces { flex-direction: row; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); }
    .item .veces-sel { font-size: 13px; padding: 6px 8px; border-radius: 8px; }
    fieldset.sonido {
      border: 1px solid rgba(246,201,14,.5); border-radius: 12px; padding: 10px 12px 12px;
      display: flex; flex-direction: column; gap: 10px; background: rgba(246,201,14,.06);
    }
    fieldset.sonido[hidden] { display: none; }
    /* lo oculto no se ve (los label tienen display:flex y antes ganaban al atributo hidden) */
    [hidden]:not([data-campo="cambio"]) { display: none !important; }
    .tel-filas { display: flex; flex-direction: column; gap: 8px; }
    .tel-fila { display: grid; grid-template-columns: 140px 1fr 1fr 40px; gap: 8px; }
    .tel-fila.reu-sala-fila { grid-template-columns: 200px 1fr 160px 40px; }
    .tel-fila.reu-curso-fila { grid-template-columns: 1.1fr 170px 1fr 190px 1fr 40px; }
    /* "¿Cuándo?" oculto conserva su lugar, así las columnas quedan alineadas */
    .reu-curso-fila [data-campo="cambio"][hidden] { display: block; visibility: hidden; }
    .reu-bloque { border-color: var(--gold); }
    .reu-horas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .reu-horas label { display: flex; flex-direction: column; gap: 6px; }
    @media (max-width: 640px) { .reu-horas { grid-template-columns: 1fr; } }
    .reu-bloque legend { padding: 0 6px; }
    .reu-nombre { font-weight: 800; font-size: 16px; color: var(--gold); background: transparent; border: 1px dashed var(--gold); border-radius: 8px; padding: 4px 8px; width: 240px; }
    .reu-rapido { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.05); }
    .reu-rapido span { font-weight: 700; color: var(--gold); font-size: 13px; }
    .reu-rapido input, .reu-rapido select { width: auto; flex: 1; min-width: 120px; }
    .reu-acciones { display: flex; flex-wrap: wrap; gap: 8px; }
    .reu-acciones .btn { width: auto; }
    #reu-nueva { margin: 4px 0 12px; }
    @media (max-width: 640px) { .tel-fila.reu-sala-fila, .tel-fila.reu-curso-fila { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .tel-fila { grid-template-columns: 1fr 1fr; } }
    /* ⭐ destacados: una fila por alumno */
    .dest-filas { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 12px; }
    /* ⭐ Destacados por curso: cada curso es un botón que se abre */
    .dp-nivel h3 { font-size: 15px; color: var(--gold); margin: 16px 0 8px; }
    .dp-cursos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
    .dp-grupo { border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.04); }
    .dp-grupo > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .dp-grupo > summary::-webkit-details-marker { display: none; }
    .dp-grupo > summary:hover { background: rgba(255,255,255,.06); border-radius: 12px; }
    .dp-resumen { font-size: 13px; color: var(--gold); font-weight: 700; white-space: nowrap; }
    .dp-grupo[open] { grid-column: 1 / -1; border-color: var(--gold); background: rgba(246,201,14,.05); }
    .dp-grupo[open] > summary b { font-size: 18px; }
    .dp-cuerpo { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
    .dp-lista { display: flex; flex-direction: column; gap: 8px; }
    .dp-item { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: rgba(255,255,255,.05); }
    .dp-item.cambiado { outline: 2px solid var(--gold); }
    .dp-item img { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; border: 2px solid var(--gold); }
    .dp-item img.ancha { width: 128px; height: 72px; }
    .dp-curso .dp-item { grid-template-columns: 128px minmax(0, 1fr) auto; }
    .dp-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
    .dp-campos label, .dp-nuevo-curso label:not(.btn), .dp-publicar label { text-transform: none; letter-spacing: 0; font-size: 12px; }
    .dp-opciones .dos { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .dp-opciones label, .dp-opciones select { min-width: 0; width: 100%; }
    .dp-acc .del { background: transparent; border: 1px solid var(--red); color: #ff8b8e; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 700; }
    .dp-acc { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .btn.mini { padding: 7px 12px; font-size: 13px; }
    .dp-subir { display: inline-block; cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 14px; }
    .dp-publicar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .dp-publicar label { flex: 1; min-width: 220px; }
    .dp-curso { border-top: 1px dashed var(--line); padding-top: 10px; }
    .dp-nuevo-curso { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
    .dp-nuevo-curso label:not(.btn) { flex: 1; min-width: 200px; }
    .dp-vista { width: 128px; height: 72px; object-fit: cover; border-radius: 10px; border: 2px solid var(--gold); }
    .dp-filas { display: flex; flex-direction: column; gap: 8px; }
    .dp-filas .dest-fila:not(.con-detalle) { grid-template-areas: "foto nom nom x" "foto mot mot x"; }
    .dp-filas .dest-fila:not(.con-detalle) label:nth-of-type(2) { grid-area: mot; }
    .dest-fila.con-detalle { grid-template-areas: "foto nom det x" "foto mot mot x"; }
    .dest-fila.con-detalle label:nth-of-type(2) { grid-area: det; }
    .dest-fila.con-detalle label:nth-of-type(3) { grid-area: mot; }
    @media (max-width: 640px) { .dp-item, .dp-curso .dp-item { grid-template-columns: 72px 1fr; } .dp-acc { grid-column: 1 / -1; } }
    /* Destacados: formulario a todo el ancho (las filas de alumnos necesitan espacio) y lo publicado debajo */
    .grid.una-col { grid-template-columns: 1fr !important; max-width: 980px; }
    /* foto a la izquierda · arriba el nombre (grande) · abajo curso y motivo */
    .dest-fila { display: grid; grid-template-columns: 84px minmax(0, 1fr) minmax(0, 1fr) 36px; grid-template-areas: "foto nom nom x" "foto cur mot x";
      gap: 8px 10px; align-items: end; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
    .dest-fila img { grid-area: foto; width: 84px; height: 84px; object-fit: cover; border-radius: 12px; border: 2px solid var(--gold); align-self: center; }
    .dest-fila label, .dest-fila input, .dest-fila select { min-width: 0; width: 100%; box-sizing: border-box; }
    .dest-fila label { gap: 3px; font-size: 11px; letter-spacing: .03em; text-transform: none; margin: 0; }
    .dest-fila label:nth-of-type(1) { grid-area: nom; }
    .dest-fila label:nth-of-type(2) { grid-area: cur; }
    .dest-fila label:nth-of-type(3) { grid-area: mot; }
    .dest-fila .tel-quitar { grid-area: x; align-self: start; }
    .dest-fila input[data-campo="nombre"] { font-size: 16px; font-weight: 700; }
    /* reunión: qué niveles tienen reunión y reunión general previa */
    .reu-niveles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; margin: 6px 0 10px; }
    @media (max-width: 640px) { .reu-niveles { grid-template-columns: 1fr; } }
    .reu-tabla-head { display: grid; grid-template-columns: 1.1fr 170px 1fr 190px 1fr 40px; gap: 8px; font-size: 12px; font-weight: 700;
      color: var(--gold); text-transform: uppercase; letter-spacing: .05em; padding: 0 2px 4px; }
    @media (max-width: 640px) { .reu-tabla-head { display: none; } }
    .curso-fijo { background: transparent !important; border-color: transparent !important; font-weight: 800; color: #fff; }
    .reu-curso-fila.sin-sala [data-campo="sala"] { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(246,201,14,.35); }
    /* 🎨 temas de colores y fondo */
    .tema-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 10px; }
    .tema-op { cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--ink); gap: 6px; position: relative; }
    .tema-op input { position: absolute; opacity: 0; }
    .tema-muestra { height: 64px; border-radius: 12px; border: 3px solid transparent; display: flex; align-items: flex-end; gap: 4px; padding: 8px; }
    .tema-muestra i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); }
    .tema-op input:checked + .tema-muestra { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(246,201,14,.35); }
    .tema-op input:focus-visible + .tema-muestra { outline: 2px solid #fff; }
    .tema-propio input[type=color] { height: 42px; padding: 2px; cursor: pointer; }
    .fondo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 14px; margin: 6px 0 12px; }
    .tema-vista-acc { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .tema-vista-acc select { width: auto; }
    .tema-vista { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; border: 2px solid var(--line); background: #000; }
    .tema-vista iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
    .sello-fila { display: grid; grid-template-columns: 70px minmax(0, 1fr) minmax(0, 2fr) 36px; gap: 8px; align-items: end; }
    .sello-fila label { text-transform: none; letter-spacing: 0; min-width: 0; }
    .sello-fila select { font-size: 22px; padding: 4px; }
    @media (max-width: 640px) { .sello-fila { grid-template-columns: 70px 1fr 36px; } .sello-fila label:nth-of-type(2) { grid-column: 1 / -1; } }
    .eq-item img { border-radius: 50%; }
    .tema-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tema-tabs button { background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--ink); border-radius: 99px; padding: 8px 14px; cursor: pointer; font-weight: 700; }
    .tema-tabs button.on { background: var(--gold); color: #06153a; border-color: var(--gold); }
    .tema-propio-perfil { margin-bottom: 10px; }
    .tema-editor.apagado { opacity: .35; pointer-events: none; }
    .img-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .img-op { position: relative; cursor: pointer; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; border: 3px solid transparent; background: rgba(255,255,255,.06); }
    .img-op img { width: 100%; height: 100%; object-fit: cover; }
    .img-op input { position: absolute; opacity: 0; }
    .img-op:has(input:checked) { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(246,201,14,.35); }
    .img-subir { display: grid; place-items: center; text-align: center; border: 2px dashed var(--line); color: var(--gold); font-size: 13px; text-transform: none; letter-spacing: 0; }
    .img-quitar { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; }
    .tema-ajustes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; align-items: end; }
    .tema-rango { text-transform: none; letter-spacing: 0; }
    .tema-rango output { color: var(--gold); font-weight: 800; }
    .tema-rango input[type=range] { accent-color: var(--gold); padding: 0; }
    .tel-fila.ed-fila { grid-template-columns: 80px 1fr auto 40px; align-items: center; }
    .reu-previas { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .reu-previa-fila { display: grid; grid-template-columns: 1.6fr 1.2fr 110px 1.2fr 1.2fr 36px; gap: 8px; align-items: end; }
    .reu-previa-fila label { text-transform: none; letter-spacing: 0; min-width: 0; }
    .reu-previa-fila input, .reu-previa-fila select { min-width: 0; width: 100%; }
    @media (max-width: 760px) { .reu-previa-fila { grid-template-columns: 1fr 1fr; } }
    .reu-previa-box { border: 1px dashed #2fbf71; border-radius: 10px; padding: 10px; margin: 10px 0; }
    details.reu-detalle > summary { cursor: pointer; font-weight: 700; color: var(--gold); margin: 8px 0; }
    .clave-box { max-width: 520px; }
    .link-btn { background: none; border: 0; color: var(--gold); text-decoration: underline; cursor: pointer; font: inherit; font-size: 13px; padding: 4px; }
    .tel-quitar { border: 1px solid var(--red); background: transparent; color: #ff8b8e; border-radius: 10px; cursor: pointer; font-weight: 800; }
    #tel-agregar { align-self: flex-start; padding: 8px 14px; }
    fieldset.grupo { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
    fieldset.grupo legend { color: var(--gold); font-weight: 800; padding: 0 6px; font-size: 15px; }
    fieldset.sonido legend { color: var(--gold); font-weight: 800; padding: 0 6px; font-size: 14px; }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .etiqueta { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .icon-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; margin-top: -4px; }
    .icon-picker button {
      height: 42px; font-size: 22px; line-height: 1; border-radius: 10px; cursor: pointer;
      background: rgba(6,21,58,.6); border: 2px solid var(--line); display: grid; place-items: center; padding: 0;
    }
    .icon-picker button img { height: 30px; }
    .icon-picker button:hover { border-color: var(--muted); }
    .icon-picker button.on { border-color: var(--gold); background: rgba(246,201,14,.18); box-shadow: 0 0 0 2px rgba(246,201,14,.25); }
    .item .lista-ico { width: 44px; height: 44px; font-size: 24px; flex: none; }
    .item .toggle { background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .item .toggle.on { border-color: var(--gold); color: var(--gold); }
    label.check { flex-direction: row; align-items: flex-start; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); font-weight: 500; }
    label.check input { margin-top: 2px; accent-color: var(--gold); }
    .item .del { background: transparent; border: 1px solid var(--red); color: #ff8b8e; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .item .edit { background: transparent; border: 1px solid var(--gold); color: var(--gold); border-radius: 8px; padding: 6px 10px; cursor: pointer; margin-right: 6px; }
    .panel.editando { outline: 2px solid var(--gold); }
    .panel.editando h2 { color: var(--gold); }
    #cancelar-edicion { margin-top: 8px; width: 100%; }
    .preview { max-height: 180px; border-radius: 10px; object-fit: cover; }
    .msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 10px; font-weight: 700; z-index: 99; }
    .msg.ok { background: #2fbf71; color: #fff; } .msg.err { background: var(--red); color: #fff; }
    .note { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    .warn { background: rgba(229,72,77,.15); border: 1px solid var(--red); padding: 12px; border-radius: 10px; margin-bottom: 16px; }
  </style>
</head>
