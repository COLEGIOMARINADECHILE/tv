<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familias · Colegio Marina de Chile</title>
  <link rel="icon" href="insignia.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0a1f52">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261104i">
</head>
<body>
  <div class="tv">
    <div id="hdr"></div>

    <main class="family">
      <div class="family-main">
        <section class="gallery card" id="gal"></section>
        <!-- Modo reunión de apoderados: sala de cada curso (reemplaza al carrusel mientras está activo) -->
        <section class="reunion card" id="reunion" hidden></section>
        <!-- Contáctanos: teléfonos + QR de sitio web, Instagram y YouTube (Admin → Ajustes) -->
        <section class="contacto card" id="contacto" hidden></section>
      </div>
      <aside class="family-side">
        <div class="aviso-hoy" id="aviso-hoy" hidden></div>
        <!-- Próxima reunión de apoderados: día, cursos (en rango), edificio y hora -->
        <section class="card prox-reunion" id="prox-reunion" hidden></section>
        <!-- en modo reunión, las fotos siguen pasando aquí en tamaño chico -->
        <section class="gallery card mini-fotos" id="gal-mini" hidden></section>
        <section class="card dates">
          <div class="card-title"><span class="dot"></span>Fechas importantes</div>
          <div class="date-list" id="fechas"></div>
        </section>
        <section class="card tip" id="tip"></section>
        <!-- ocupa el espacio que sobra cuando hay pocos textos -->
        <div class="side-logo"><img src="insignia.png" alt="Escudo Colegio Marina de Chile"></div>
      </aside>
    </main>

    <footer class="ticker" id="ticker"></footer>
  </div>

  <!-- generador de códigos QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js?v=20261104i"></script>
  <script src="api.js?v=20261104i"></script>
  <script src="common.js?v=20261104i"></script>
  <script src="familias.js?v=20261104i"></script>
</body>
</html>
