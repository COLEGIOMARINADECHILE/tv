<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantallas Colegio Marina de Chile</title>
  <link rel="icon" href="assets/insignia.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="home">
    <div>
      <img class="logo" src="assets/insignia.png" alt="Escudo Colegio Marina de Chile">
      <h1>Colegio Marina de Chile</h1>
      <h2>Concepción</h2>
      <p class="choose">Seleccione un perfil con el control remoto</p>
      <nav class="profiles">
        <a class="profile" href="funcionarios.html" autofocus>
          <span class="ico">📺</span>
          <b>Funcionarios</b>
          <span>Televisión en vivo + actividades de la semana, fotos e información educativa</span>
        </a>
        <a class="profile" href="familias.html">
          <span class="ico">👨‍👩‍👧‍👦</span>
          <b>Familias</b>
          <span>Pantalla completa con fechas importantes y actividades en imágenes</span>
        </a>
      </nav>
    </div>
  </main>
  <script>
    // Navegación con flechas del control remoto
    const items = [...document.querySelectorAll('.profile')];
    items[0].focus();
    document.addEventListener('keydown', e => {
      const i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { items[Math.min(i + 1, items.length - 1)].focus(); e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { items[Math.max(i - 1, 0)].focus(); e.preventDefault(); }
    });
    // Abrir directamente un perfil guardado: index.html?perfil=funcionarios
    // index.html?perfil=funcionarios&tv=0 → funcionarios sin TV
    const q = new URLSearchParams(location.search);
    const p = q.get('perfil');
    if (p === 'funcionarios' || p === 'familias') location.replace(p + '.html' + (q.get('tv') === '0' ? '?tv=0' : ''));
  </script>
</body>
</html>
